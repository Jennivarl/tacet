<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacet: warrant canaries that die on their own</title>
    <meta name="description" content="Tacet puts warrant canaries on Arkiv, the Web3 database. If a company stops renewing, the canary expires by itself and anyone can verify it." />
    <meta name="theme-color" content="#f5efe3" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e0e10'/%3E%3Cpath d='M8 11h16' stroke='%23f5efe3' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='11' y='11' width='10' height='6' rx='1.2' fill='%23f5c400'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body { background: #f5efe3; margin: 0; }
      :root[data-theme="dark"], :root[data-theme="dark"] body { background: #0b0b0d; }
    </style>
    <script>
      try {
        const t = localStorage.getItem("tacet-theme")
        if (t) document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#/" aria-label="Tacet home">
          <svg class="logo-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" class="logo-bg" fill="#17140f" />
            <path d="M8 11h16" class="logo-line" stroke="#f5efe3" stroke-width="2" stroke-linecap="round" />
            <rect x="11" y="11" width="10" height="6" rx="1.2" class="logo-rest" fill="#f2b705" />
          </svg>
          <span>tacet</span>
        </a>
        <nav class="links" aria-label="Main">
          <a href="#/" data-nav="">Board</a>
          <a href="#/how" data-nav="how">How it works</a>
          <a href="https://github.com/Jennivarl/tacet" target="_blank" rel="noopener">GitHub</a>
        </nav>
        <div class="nav-actions">
          <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode"></button>
          <a class="btn btn-primary btn-sm" href="#/publish" data-nav="publish">Publish a canary</a>
        </div>
      </div>
    </header>
    <main id="app"></main>
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <b>tacet</b> <span class="muted">/ˈteɪsɛt/: a musical direction meaning "be silent".</span>
        </div>
        <div class="footer-links">
          <span>Built on <a href="https://arkiv.network" target="_blank" rel="noopener">Arkiv</a> · Tiramisu testnet</span>
          <span>All organizations shown are fictional demo data</span>
          <a href="https://github.com/Jennivarl/tacet" target="_blank" rel="noopener">MIT licensed</a>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
